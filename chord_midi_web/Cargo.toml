# このクレート自身を workspace のルートにする。root の Cargo.toml が
# chord_midi_web を exclude しているため、これが無いと git worktree の
# 中で cargo が親ディレクトリへ登り、メインリポジトリの Cargo.toml を
# workspace と誤認してビルドできなくなる
[workspace]

[package]
name = "chord_midi_web"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
yew = { version = "0.21", features = ["csr"] }
web-sys = { version = "0.3.66", features = ["HtmlSelectElement"] }
chord_midi = { path = "../chord_midi" }
serde_json = "1"
